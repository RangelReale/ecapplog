<?xml version="1.0" encoding="UTF-8"?>
<!--
	macOS wrapper around the small optical size - see ecapplog-macos.svg for why the inset exists,
	and ecapplog-small.svg for why a separate small design exists at all.

	Feeds icon_16x16@2x.png and icon_32x32.png, which are both 32 device pixels. The 16px slot goes
	through ecapplog-macos-tiny.svg instead, because no cap height survives 16 pixels.

	Two deliberate departures from the large wrapper, both because this one never renders above 32
	device pixels:

	- No shadow. The large wrapper's blur is stdDeviation 8 on a 1024 grid, which is a quarter of a
	  device pixel at 32px - it cannot read as depth at this size, and all it produces is a grey
	  fringe that smears the tile edge into Finder's list-view background.
	- A tighter inset, 880 rather than 824. Apple's margin is sized to leave room for the shadow;
	  with no shadow to accommodate, spending 20% of a 32px canvas on emptiness costs legibility
	  for nothing - and here it would cost the wordmark, which already spans most of the tile. The
	  remaining margin still keeps it from crowding neighbouring rows.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1024" height="1024" viewBox="0 0 1024 1024">
	<image xlink:href="ecapplog-small.svg" x="72" y="72" width="880" height="880"/>
</svg>
